<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kiro-watch — give the Kiro agent eyes and ears for any video">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#101b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#5ed6ff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#2f8fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f8fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ed6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ed6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5ed6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="360" y1="150" x2="360" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8c7da"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1b2740" stroke-width="1" opacity="0.5">
    <path d="M0 110 H1280 M0 220 H1280 M0 330 H1280"/>
    <path d="M160 0 V440 M320 0 V440 M480 0 V440 M640 0 V440 M800 0 V440 M960 0 V440 M1120 0 V440"/>
  </g>

  <!-- eye / lens emblem -->
  <g transform="translate(170 220)">
    <circle r="150" fill="url(#glow)" filter="url(#soft)" opacity="0.8"/>
    <!-- eye almond -->
    <path d="M-120 0 Q0 -92 120 0 Q0 92 -120 0 Z" fill="#0a0e14" stroke="#5ed6ff" stroke-width="3"/>
    <!-- iris as camera aperture -->
    <circle r="58" fill="#0d1a2b" stroke="#2f8fff" stroke-width="2.5"/>
    <g stroke="#5ed6ff" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M0 -58 L34 -14"/>
      <path d="M50 29 L8 54"/>
      <path d="M-50 29 L-8 54"/>
      <path d="M0 -58 L-34 -14"/>
      <path d="M50 -29 L-8 -54"/>
      <path d="M-50 -29 L8 -54"/>
    </g>
    <circle r="22" fill="#5ed6ff"/>
    <circle r="22" fill="url(#glow)"/>
    <circle cx="8" cy="-8" r="6" fill="#eaf7ff"/>
    <!-- scan line sweeping the lens -->
    <rect x="-120" y="-6" width="240" height="12" fill="url(#scan)" opacity="0.7"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(360 0)">
    <text x="0" y="150" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace" font-size="26" letter-spacing="6" fill="#5ed6ff" opacity="0.9">MCP · LOCAL · NO&#160;API&#160;KEY</text>
    <text x="-2" y="214" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace" font-weight="700" font-size="76" fill="url(#title)">kiro-watch</text>
    <text x="0" y="262" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="27" fill="#aebfd4">Give the Kiro agent eyes and ears for any video.</text>

    <!-- pipeline chips -->
    <g font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace" font-size="17">
      <g transform="translate(0 300)">
        <rect width="118" height="40" rx="10" fill="#132033" stroke="#28415f"/>
        <text x="59" y="26" text-anchor="middle" fill="#9fd6ff">yt-dlp</text>
      </g>
      <text x="130" y="326" fill="#45617f" font-size="20">&#8594;</text>
      <g transform="translate(158 300)">
        <rect width="118" height="40" rx="10" fill="#132033" stroke="#28415f"/>
        <text x="59" y="26" text-anchor="middle" fill="#9fd6ff">ffmpeg</text>
      </g>
      <text x="288" y="326" fill="#45617f" font-size="20">&#8594;</text>
      <g transform="translate(316 300)">
        <rect width="128" height="40" rx="10" fill="#132033" stroke="#28415f"/>
        <text x="64" y="26" text-anchor="middle" fill="#9fd6ff">whisper</text>
      </g>
      <text x="456" y="326" fill="#45617f" font-size="20">&#8594;</text>
      <g transform="translate(484 300)">
        <rect width="168" height="40" rx="10" fill="#15243a" stroke="#5ed6ff"/>
        <text x="84" y="26" text-anchor="middle" fill="#eaf7ff">Kiro sees it</text>
      </g>
    </g>
  </g>
</svg>
